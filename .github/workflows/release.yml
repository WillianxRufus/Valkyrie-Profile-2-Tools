name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.16'
      - name: Regression suite
        run: python -m unittest discover -s tests -q
      - name: Language packs are well formed
        run: |
          for pack in translations/*/; do
            python vp2_translate.py check-pack "$pack"
          done

  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            name: Windows
            binary: ValkyrieProfile2-Translator.exe
            suffix: windows-x64
            extension: .zip
          - os: ubuntu-24.04
            name: Linux
            binary: ValkyrieProfile2-Translator
            suffix: linux-x64
            extension: .tar.gz

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        if: runner.os == 'Windows'
        with:
          python-version: '3.11.9'
      - name: Install PyInstaller
        if: runner.os == 'Windows'
        run: python -m pip install --disable-pip-version-check "pyinstaller==6.22.2"

      - name: Resolve package name
        id: package
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            version="dev-${GITHUB_SHA::7}"
          fi
          name="ValkyrieProfile2-Translator-${version}-${{ matrix.suffix }}"
          {
            echo "version=$version"
            echo "name=$name"
            echo "archive=${name}${{ matrix.extension }}"
          } >> "$GITHUB_OUTPUT"

      - name: Build Windows
        if: runner.os == 'Windows'
        run: >-
          python -m PyInstaller data/vp2_release.spec
          --workpath workspace/internal/build
          --clean --noconfirm
      - name: Self-check the Windows binary
        if: runner.os == 'Windows'
        shell: bash
        run: ./dist/${{ matrix.binary }} --self-check
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cd dist
          mv "${{ matrix.binary }}" "${{ steps.package.outputs.name }}.exe"
          7z a -tzip "../${{ steps.package.outputs.archive }}" \
            "${{ steps.package.outputs.name }}.exe" > /dev/null

      - name: Build and package Linux through the release container
        if: runner.os == 'Linux'
        run: |
          docker build \
            --target artifact \
            --build-arg VERSION="${{ steps.package.outputs.version }}" \
            --output type=local,dest=. \
            .

      - name: Show package
        shell: bash
        run: ls -l "${{ steps.package.outputs.archive }}"

      - name: Unpack what will be published
        shell: bash
        run: |
          mkdir -p roundtrip && cd roundtrip
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z x "../${{ steps.package.outputs.archive }}" > /dev/null
            binaries=(./*.exe)
          else
            tar -xzf "../${{ steps.package.outputs.archive }}"
            binaries=(./ValkyrieProfile2-Translator-*)
            test -x "${binaries[0]}"
          fi
          test "${#binaries[@]}" -eq 1
          "${binaries[0]}" --self-check

      - uses: actions/upload-artifact@v4
        with:
          name: translator-${{ matrix.suffix }}
          path: ${{ steps.package.outputs.archive }}
          if-no-files-found: error
          compression-level: 0

  release:
    name: Publish
    needs: [test, build]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Show what is being published
        run: ls -l artifacts/

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: artifacts/*
          fail_on_unmatched_files: true
          body: |
            Download the archive for your platform, unpack it, and open the
            translator. Its window guides you through preparing the local
            workspace and building a translated image. Nothing here contains
            game data: the first run reads your own disc image to build what
            it needs.

            The command line remains available for automation:

                ValkyrieProfile2-Translator generate <your-image.iso>
                ValkyrieProfile2-Translator build <your-image.iso>

            The patched image is written to the directory you run it from.
            Pass the Japanese disc to `generate` as well, in any order, to
            get the original script beside the English in the reference
            tables.
